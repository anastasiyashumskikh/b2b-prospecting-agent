[project]
name = "prospect"
version = "0.1.0"
description = "B2B prospecting agent: buying-group contacts, public context and outreach drafts"
authors = [
    { name = "Anastasiya Shumskikh", email = "anastasiya.shumskikh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
prospect = "prospect.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real claude CLI (run with -m live)"]
addopts = "-m 'not live'"
