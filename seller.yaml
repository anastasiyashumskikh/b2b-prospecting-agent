    Happy to show you a 20-minute demo on one of {company}'s own scenarios. Does next week work?

    Best,
    [Your name]

# Buying roles follow the case brief: economic buyers, decision-makers, champions.
roles:
  economic_buyer:
    label: economic buyer, owns the customer service budget
    titles: [VP Customer Service, SVP Customer Care, Director of Customer Operations, Head of Contact Centre, Chief Customer Officer]
    pain: >-
      Owns the cost and quality of customer care: support volume and cost per contact keep growing
      while customer expectations rise, and AI pilots have not yet shown impact at scale.
  decision_maker:
    label: decision-maker, decides which customer service software and AI the company buys
    titles: [Chief Information Officer, Head of Contact Centre Technology, Head of CX Technology, Head of Digital Self-Service, Head of Conversational AI, Head of Conversational Banking, Head of Chatbots and AI, Head of Digital Automation]
    pain: >-
      Has to make AI fit the existing CRM and contact-center stack safely: integration effort, data
      security, governance of generative AI, and avoiding another failed AI deployment.
    hints:
      - If the company runs its own AI assistant or chatbot for customers, look first for the owner of that AI program.
      - If the company is moving to a cloud contact-center platform, has an AI risk or governance committee, or is in a regulated industry (banking, insurance, healthcare), look first for the CIO.
  champion:
    label: champion, runs customer support day to day and pushes the change internally
    titles: [Director of Customer Service Operations, Head of Customer Service Operations, Head of Contact Centre Operations, Head of Customer Care Partner Management, Customer Service Vendor Manager]
    pain: >-
      Runs the support floor or the outsourcing partners: agent ramp-up time, handle time, quality across
      languages and sites, and pressure to automate without hurting satisfaction scores.
    hints:
      - Look first for the director of customer service operations.
      - Take the person who manages outsourcing partners only if support is outsourced to several BPO partners; then say in why that this is the entry point for an AI-plus-people offer.
