# The seller the agent prospects for. The agent may state about the seller only the facts below.
# Swap this file to point the same agent at another product.

name: Concentrix iX Suite
company: Concentrix
summary: >-
  AI products for customer experience operations: iX Hello (generative-AI platform for building
  self-service assistants and agents) and iX Hero (agent desktop with an AI copilot, human in the loop).
icp: >-
  Enterprises with large customer support or contact-center operations (thousands of agents or
  millions of customer interactions a year), often multilingual and multi-country, in technology and
  consumer electronics, retail, travel and e-commerce, communications and media, banking, financial
  services and insurance, or healthcare. Strong signals: growing support volume, hiring for support,
  expansion into new markets or languages, a visible AI or CX transformation agenda, public complaints
  about support quality.

facts:
  - text: Concentrix launched the iX Suite of AI products in September 2024.
    source:
      url: https://www.sec.gov/Archives/edgar/data/1803599/000180359926000027/cnxc-20251130.htm
      title: Concentrix Form 10-K, fiscal 2025
  - text: iX Hello is a generative-AI platform for building self-service assistants and agents.
    source:
      url: https://www.sec.gov/Archives/edgar/data/1803599/000180359926000027/cnxc-20251130.htm
      title: Concentrix Form 10-K, fiscal 2025
  - text: Since September 2025 iX Hello is the agent-building platform inside Concentrix's Agentic Operating Framework, which targets the issues behind failed enterprise AI deployments.
    source:
      url: https://www.globenewswire.com/news-release/2025/09/18/3152486/0/en/Concentrix-Launches-Agentic-Operating-Framework-to-Help-Enterprises-Solve-Key-Issues-Behind-Failed-AI-Deployments.html
      title: Concentrix Launches Agentic Operating Framework (GlobeNewswire, 18 Sep 2025)
      published: "2025-09-18"
  - text: iX Hero is an agentic desktop for contact-center agents with a human in the loop, giving real-time answers, summaries, analytics and training.
    source:
      url: https://www.concentrix.com/ix-hero/
      title: iX Hero product page
  - text: iX Hero won TMC's 2026 Customer Product of the Year award.
    source:
      url: https://www.concentrix.com/about/news/concentrix-ix-hero-wins-tmc-2026-customer-product-year/
      title: Concentrix iX Hero wins TMC 2026 Customer Product of the Year
  - text: Concentrix rolled out pre-built agentic AI agents for product support, order status, appointment scheduling and collections in December 2025.
    source:
      url: https://www.concentrix.com/about/news/press-release/concentrix-rolls-out-pre-built-agentic-ai-for-instant-business-impact/
      title: Concentrix rolls out pre-built agentic AI for instant business impact
      published: "2025-12-22"
  - text: Concentrix closed nearly 100 iX deals in Q2 fiscal 2026, up 400% year over year.
    source:
      url: https://www.sec.gov/Archives/edgar/data/0001803599/000180359926000133/exhibit991q22026.htm
      title: Concentrix Q2 fiscal 2026 results (8-K exhibit 99.1)
  - text: Concentrix serves more than 2,000 clients, including more than 160 of the Fortune Global 500.
    source:
      url: https://www.sec.gov/Archives/edgar/data/1803599/000180359926000027/cnxc-20251130.htm
      title: Concentrix Form 10-K, fiscal 2025

